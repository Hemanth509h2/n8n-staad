# Render Blueprint: n8n web service built from ./Dockerfile, with a Render
# Postgres database for workflows, credentials and execution history.
#
# Both use the free plan. On free, the web service sleeps after 15 minutes
# without traffic (so schedule triggers stop firing and the first webhook
# after a sleep is slow), and the free database expires after 30 days. Use a
# paid plan for anything you depend on.

services:
  - type: web
    name: n8n-service
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    autoDeploy: true

    # N8N_WEBHOOK_URL, N8N_EDITOR_BASE_URL and N8N_PROXY_HOPS are filled in at
    # startup by render-entrypoint.sh. Set any of them here to override.
    envVars:
      # Tells Render up front which port n8n listens on, so it doesn't have to
      # detect it and restart the deploy. render-entrypoint.sh copies it to
      # N8N_PORT.
      - key: PORT
        value: "5678"

      # Encrypts the credentials stored in the database. Never change it
      # after the first deploy, or every saved credential becomes unreadable.
      # Copy it somewhere safe.
      - key: N8N_ENCRYPTION_KEY
        generateValue: true

      - key: DB_TYPE
        value: postgresdb
      - key: DB_POSTGRESDB_HOST
        fromDatabase:
          name: n8n-db
          property: host
      - key: DB_POSTGRESDB_PORT
        fromDatabase:
          name: n8n-db
          property: port
      - key: DB_POSTGRESDB_DATABASE
        fromDatabase:
          name: n8n-db
          property: database
      - key: DB_POSTGRESDB_USER
        fromDatabase:
          name: n8n-db
          property: user
      - key: DB_POSTGRESDB_PASSWORD
        fromDatabase:
          name: n8n-db
          property: password

      # Keeps execution history from filling the free database's 1 GB.
      - key: EXECUTIONS_DATA_PRUNE
        value: "true"
      - key: EXECUTIONS_DATA_MAX_AGE
        value: "168" # hours (7 days)

databases:
  - name: n8n-db
    plan: free
    # Paid plans can grow the disk in 5 GB steps:
    # diskSizeGB: 5
