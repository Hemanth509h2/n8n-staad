# Render Blueprint: n8n web service built from ./Dockerfile.
#
# Every non-secret setting (database host, schema, SSL, time zone, ...) is baked
# into the Dockerfile. The two secrets, DB_POSTGRESDB_PASSWORD and
# N8N_ENCRYPTION_KEY, are not in this public repo: after creating the service,
# add your .env as a Secret File named `.env` (Environment -> Secret Files).
# render-entrypoint.sh loads /etc/secrets/.env on startup and refuses to start
# without the encryption key.
#
# On the free plan the service sleeps after 15 minutes without traffic, so
# schedule triggers stop firing and the first webhook after a sleep is slow.

services:
  - type: web
    name: n8n-service
    runtime: docker
    plan: free
    # Same region as the Neon database (aws ap-southeast-1).
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      # Tells Render up front which port n8n listens on, so it doesn't have to
      # detect it and restart the deploy.
      - key: PORT
        value: "5678"
